<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>G-Mura · POS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Geist', system-ui, sans-serif; background: #f0eee9; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  /* Hide scrollbar in artboards */
  .gm-screen *::-webkit-scrollbar { width: 8px; height: 8px; }
  .gm-screen *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  .gm-screen *::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="pos-shared.jsx"></script>
<script type="text/babel" src="pos-v1.jsx"></script>
<script type="text/babel" src="pos-v2.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#8b5cf6",
  "density": "regular"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="pos-variations"
          title="G-Mura · Pantalla de ventas (POS)"
          subtitle="Dos exploraciones de layout · misma identidad visual · violeta como acento quirúrgico"
        >
          <DCArtboard
            id="v1"
            label="V1 · Compacto · sidebar de íconos"
            width={1440}
            height={900}
          >
            <div data-screen-label="POS V1 Compacto" className="gm-screen" style={{ width: '100%', height: '100%' }}>
              <POSPageV1 accent={t.accent} density={t.density} />
            </div>
          </DCArtboard>

          <DCArtboard
            id="v2"
            label="V2 · Con aire · sidebar completo"
            width={1440}
            height={900}
          >
            <div data-screen-label="POS V2 Aire" className="gm-screen" style={{ width: '100%', height: '100%' }}>
              <POSPageV2 accent={t.accent} density={t.density} />
            </div>
          </DCArtboard>

          <DCPostIt top={-30} left={1480} rotate={3} width={220}>
            Tipo: Bricolage Grotesque (display) + Geist (body). Violeta solo en CTA principal, badge de turno, ítem activo del sidebar y selección de variantes.
          </DCPostIt>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks · G-Mura">
        <TweakSection label="Identidad" />
        <TweakColor label="Acento" value={t.accent} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Layout" />
        <TweakRadio
          label="Densidad"
          value={t.density}
          options={['compact', 'regular', 'comfy']}
          onChange={(v) => setTweak('density', v)}
        />
        <TweakSection label="Notas" />
        <div style={{ fontSize: 11, color: 'rgba(41,38,27,0.6)', lineHeight: 1.45 }}>
          Click en cualquier card de producto para abrir el popover de variantes. Click en la flecha de la esquina superior derecha de cada artboard para ver fullscreen.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
