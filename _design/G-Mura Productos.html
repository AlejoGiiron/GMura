<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>G-Mura · Productos & variantes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: 'Geist', system-ui, sans-serif; background: #f8f7f5; color: #1a1a1a; -webkit-font-smoothing: antialiased; overflow: hidden; }
  #root { height: 100%; }
  button { font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  *::-webkit-scrollbar { width: 8px; height: 8px; }
  *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  *::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="pos-shared.jsx"></script>
<script type="text/babel" src="gm-sidebar.jsx"></script>
<script type="text/babel" src="prod-data.jsx"></script>
<script type="text/babel" src="prod-shared.jsx"></script>
<script type="text/babel" src="products-v2.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#8b5cf6"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <div data-screen-label="Productos & variantes" style={{ width: '100%', height: '100%' }}>
        <ProductsV2 accent={t.accent} />
      </div>

      <TweaksPanel title="Tweaks · G-Mura">
        <TweakSection label="Identidad" />
        <TweakColor label="Acento" value={t.accent} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Notas" />
        <div style={{ fontSize: 11, color: 'rgba(41,38,27,0.6)', lineHeight: 1.45 }}>
          Click en cualquier celda numérica (precio o stock) para editarla. Click en "Nuevo producto" abre el modal de creación.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
