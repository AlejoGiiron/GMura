<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>G-Mura · Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@300..700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: 'Geist', system-ui, sans-serif; background: #f0eee9; color: #1a1a1a; -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; }
  input { font-family: inherit; }
  .gm-screen *::-webkit-scrollbar { width: 8px; height: 8px; }
  .gm-screen *::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
  .gm-screen *::-webkit-scrollbar-track { background: transparent; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="pos-shared.jsx"></script>
<script type="text/babel" src="login.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#8b5cf6"
}/*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <DesignCanvas>
        <DCSection
          id="login-variations"
          title="G-Mura · Login"
          subtitle="Dos exploraciones · panel slate-900 + acento violeta · sin recuperación ni registro público"
        >
          <DCArtboard
            id="loginA"
            label="V1 · Editorial limpio · features numeradas"
            width={1440}
            height={900}
          >
            <div data-screen-label="Login V1" className="gm-screen" style={{ width: '100%', height: '100%' }}>
              <LoginV1 accent={t.accent} />
            </div>
          </DCArtboard>

          <DCArtboard
            id="loginB"
            label="V2 · Editorial display · saludo + cards"
            width={1440}
            height={900}
          >
            <div data-screen-label="Login V2" className="gm-screen" style={{ width: '100%', height: '100%' }}>
              <LoginV2 accent={t.accent} />
            </div>
          </DCArtboard>

          <DCPostIt top={-30} left={1480} rotate={3} width={220}>
            Misma identidad: Bricolage Grotesque + Geist · violeta solo en CTA "Ingresar", glow del panel slate y detalles de jerarquía.
          </DCPostIt>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks · G-Mura Login">
        <TweakSection label="Identidad" />
        <TweakColor label="Acento" value={t.accent} onChange={(v) => setTweak('accent', v)} />
        <TweakSection label="Notas" />
        <div style={{ fontSize: 11, color: 'rgba(41,38,27,0.6)', lineHeight: 1.45 }}>
          Mostrar/ocultar contraseña funciona. Click en "Ingresar" simula loading 1.4s. Click en la flecha de cada artboard para abrir fullscreen.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
